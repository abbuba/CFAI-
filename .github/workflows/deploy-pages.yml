name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: traffic-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: traffic-dashboard
        run: npm ci

      - name: Build static site
        working-directory: traffic-dashboard
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Publish to docs folder (main branch)
        run: |
          rm -rf docs
          cp -r traffic-dashboard/out docs

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No docs changes to commit"
          else
            git commit -m "Deploy site to docs [skip ci]"
            git push
          fi

      - name: Publish to gh-pages branch (backup)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: traffic-dashboard/out
          enable_jekyll: false
